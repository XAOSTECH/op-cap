    <circle class="commit-leaf" cx="600" cy="100" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>2598063: fix(obs-safe-launch): persist streaming state across OBS restarts; force-kill on dialog block</title></circle>
    <circle class="commit-leaf" cx="600" cy="140" r="6" fill="url(#tagGradient)" stroke="#0284c7" stroke-width="1.5"><title>4714cbc: chore: update CHANGELOG for v0.1.2</title></circle>
    <g class="commit-leaf"><rect x="591" y="171" width="18" height="18" rx="3" transform="rotate(45 600 180)" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">6</text><title>6 commits</title></g>
    <circle class="commit-leaf" cx="600" cy="220" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>ff0dd81: Merge pull request #2 from XAOSTECH:anglicise/20261001-034544</title></circle>
    <circle class="commit-leaf" cx="720" cy="260" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>662088c: chore: convert American spellings to British English</title></circle>
    <circle class="commit-leaf" cx="600" cy="340" r="9" fill="url(#tagGradient)" stroke="#0284c7" stroke-width="1.5"><title>66ab799: chore: update CHANGELOG for v0.1.1</title></circle>
    <g class="commit-leaf"><rect x="591" y="371" width="18" height="18" rx="3" transform="rotate(45 600 380)" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="384" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">47</text><title>47 commits</title></g>
    <circle class="commit-leaf" cx="480" cy="420" r="6" fill="url(#tagGradient)" stroke="#0284c7" stroke-width="1.5"><title>d9e24fc: chore: update CHANGELOG for v0.1.0 (re-release)</title></circle>
    <g class="commit-leaf"><rect x="831" y="491" width="18" height="18" rx="3" transform="rotate(45 840 500)" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/><text x="840" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">21</text><title>21 commits</title></g>
    <circle class="commit-leaf" cx="360" cy="580" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>85cc669: Merge pull request #1 from XAOSTECH:anglicise/20260401-020828</title></circle>
    <circle class="commit-leaf" cx="960" cy="660" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>a825a38: chore: convert American spellings to British English</title></circle>
