    <path class="branch-line" d="M 480 420 C 480 452, 840 468, 840 500"/>
    <path class="branch-line" d="M 840 500 C 840 532, 360 548, 360 580"/>
    <path class="branch-line" d="M 360 580 C 360 644, 240 676, 240 740"/>
    <path class="branch-line" d="M 360 580 C 360 612, 960 628, 960 660"/>
    <path class="branch-line" d="M 960 660 C 960 692, 240 708, 240 740"/>
    <path class="branch-line" d="M 240 740 C 240 772, 600 788, 600 820"/>
    <line class="trunk-line" x1="600" y1="820" x2="600" y2="860"/>
    <line class="trunk-line" x1="600" y1="860" x2="600" y2="900"/>
  </g>
  <!-- Commit nodes -->
  <g id="commits">
