    <circle class="commit-leaf" cx="600" cy="820" r="9" fill="url(#forkGradient)" stroke="#ea580c" stroke-width="1.5"><title>2eb8025: chore(dc-init): load workflows,actions</title></circle>
    <g class="commit-leaf"><rect x="591" y="851" width="18" height="18" rx="3" transform="rotate(45 600 860)" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="864" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">30</text><title>30 commits</title></g>
    <circle class="commit-leaf" cx="600" cy="900" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>4958764: Init</title></circle>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(20, 20)">
    <rect width="200" height="110" fill="white" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <circle cx="20" cy="25" r="5" fill="url(#leafGradient)" stroke="#16a34a"/>
    <text x="32" y="30" class="branch-label" font-size="12">Regular Commit</text>
    <circle cx="20" cy="50" r="6" fill="url(#mergeGradient)" stroke="#7c3aed"/>
    <text x="32" y="55" class="branch-label" font-size="12">Merge Commit</text>
    <circle cx="20" cy="75" r="6" fill="url(#forkGradient)" stroke="#ea580c"/>
